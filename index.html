  ERBQ: ["深夜那一餐幾乎不會消耗掉，而且泡麵的鈉會讓隔天水腫、更累。", ["晚餐吃飽一點，宵夜的需求會自然變小", "真的要吃泡麵：加蛋加青菜、調味包放一半、湯不要喝", "宵夜改成熱牛奶或一小碗燕麥，比較好睡"], "meal", "宵夜換成一份高纖複方蛋白餐。"],
  HROA: ["胃口好、吃得快，常常吃到撐才停，份量跟著心情走而不是跟著活動量走。", ["吃到七分飽就停，放下筷子等五分鐘再決定要不要繼續", "便當先吃菜和肉，飯最後吃", "運動日多補一點碳水，沒運動的日子飯減三分之一"], "carb", "大碗便當前先來一份碳水對策。"],
  HROQ: ["三餐規律是優點，但每餐的飯量固定偏多，又沒什麼活動量，長期下來慢慢累積。", ["外食主動說「飯少一點」，自己煮就把碗換小一號", "每餐多一份青菜，飯自然就少了", "飯後散步十分鐘，哪怕只是繞一圈"], "carb", "吃飯前先來一份碳水對策。"],
  HRBA: ["一碗麵通常只有澱粉，蛋白質和青菜都不夠，吃完兩小時就餓，然後又一碗。", ["麵加一份燙青菜和一顆滷蛋，一餐就完整", "乾麵換湯麵、湯喝一半", "一週兩天把麵換成便當或自助餐"], "meal", "趕時間的那一餐，用高纖複方蛋白餐代替。"],
  HRBQ: ["餓一整天再一次吃到十一分飽，身體會把那一餐存得特別努力。", ["白天至少吃一小餐，大餐那頓才不會失控", "吃到飽先吃蛋白質和青菜，澱粉和甜點放最後", "七分飽就收手，剩下的打包明天吃"], "meal", "白天來不及吃的那一餐，先用高纖複方蛋白餐頂著。"]
};
const PRODUCTS = {
  carb: ['碳水對策', '陪你好好享受每一碗飯'],
  soybar: ['大豆棒', '想吃甜的時候，對自己好一點'],
  meal: ['高纖複方蛋白餐', '忙碌的日子，你也值得好好吃一餐'],
  burn: ['好燃對策', '動起來之前，給自己一點活力']
};
const TILES = ['HROA', 'ESBQ', 'ESOA', 'HRBQ', 'EROQ', 'ESOQ', 'HRBA', 'HSBA', 'EROA', '', 'HSOA', 'ERBA', 'HSBQ', 'HSOQ', 'ERBQ', 'ESBA'];

const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>';

const params = new URLSearchParams(location.search);
const FROM = TYPES[params.get('from')] ? params.get('from') : '';
const SRC = params.get('src') || (FROM ? 'share' : (document.referrer ? 'referral' : 'direct'));
const VIA = params.get('via') || '';
const SHARED = params.get('shared') === '1';
const ORIG = params.get('orig') || (SRC.indexOf('share') === 0 ? '' : SRC);
const SESSION = Math.random().toString(36).slice(2) + Date.now().toString(36);
let LINE_UID = '';
let IN_LINE = false;

function fresh() {
  return { step: 'intro', qi: 0, answers: [], picks: [], sent: false };
}
let S = fresh();

function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function code() {
  const a = S.answers.join('');
  const n = (x) => a.split(x).length - 1;
  const pick = (x, y) => (n(x) > n(y) ? x : y);
  return pick('E', 'H') + pick('S', 'R') + pick('O', 'B') + pick('A', 'Q');
}
function toggle(list, id, exclusive) {
  if (exclusive.includes(id)) return list.includes(id) ? [] : [id];
  const l = list.filter((x) => !exclusive.includes(x));
  return l.includes(id) ? l.filter((x) => x !== id) : l.concat([id]);
}

function result() {
  const c = code(), T = TYPES[c];
  let list = T[4].slice();
  if (!list.includes('meal')) list.push('meal');
  return { c, T, recs: list.map((id) => ({ id, j: ['ok'] })) };
}

/* ---------- 資料送出 ---------- */
function send(payload) {
  if (!CONFIG.GAS_URL) return;
  try {
    fetch(CONFIG.GAS_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  } catch (e) { /* 送不出去也不影響測驗 */ }
}
function sendResult(r) {
  if (S.sent) return;
  S.sent = true;
  send({
    kind: 'result', session: SESSION, src: SRC, via: VIA, orig: ORIG, inLine: IN_LINE,
    lineUid: '', marketing: false, type: r.c, animal: r.T[0], tier: '',
    gender: '', age: '', bmiBand: '', waistOver80: '', goals: '',
    recs: PRODUCTS[DETAIL[r.c][2]][0]
  });
}
// 追蹤參數放在 # 後面：Facebook 會把同一型的分享視為同一個網址，預覽圖只要抓一次就會一直顯示
function shareUrl(c, via) { return CONFIG.BASE_URL + 'share_' + c + '.html#via=' + via + (ORIG ? '&orig=' + encodeURIComponent(ORIG) : ''); }
async function doShare(kind) {
  const r = result();
  const url = shareUrl(r.c, kind);
  const text = '我的吃貨動物是「' + r.T[0] + '」：' + r.T[1] + '！你是哪一種？';
  sendClick('share_' + kind, r);
  const msg0 = document.getElementById('shareMsg');
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (kind === 'fb') {
    // Facebook 按鈕本身就是連到 facebook.com/sharer 的真實連結：
    // 手機（iOS／Android）由系統直接開 Facebook App 的分享視窗；電腦才在這裡開小視窗
    const sharer = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
    if (!mobile) { const w = window.open(sharer, 'fbshare', 'width=640,height=520'); if (!w) location.href = sharer; }
    return;
  }
  if (kind === 'line') { window.open('https://line.me/R/share?text=' + encodeURIComponent(text + '\n' + url), '_blank', 'noopener'); return; }
  const msg = document.getElementById('shareMsg');
  try {
    if (navigator.canShare) {
      const blob = await fetch('card_' + r.c + '.jpg').then((x) => x.blob());
      const file = new File([blob], '我的吃貨動物_' + r.T[0] + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + ' ' + url }); return; }
    }
    if (navigator.share) { await navigator.share({ title: '吃貨動物測驗', text: text, url: url }); return; }
    await navigator.clipboard.writeText(text + ' ' + url);
    if (msg) msg.textContent = '已複製分享連結，貼給朋友吧！';
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    try { await navigator.clipboard.writeText(text + ' ' + url); if (msg) msg.textContent = '已複製分享連結，貼給朋友吧！'; } catch (e2) {}
  }
}
function sendClick(btn, r) {
  send({ kind: 'click', session: SESSION, src: SRC, orig: ORIG, type: r.c, tier: '', button: btn, lineUid: '' });
}

/* ---------- 畫面 ---------- */
function nav(back, label) {
  return `<div class="nav"><button type="button" class="back" data-act="${back}" aria-label="返回">${BACK}</button><span class="muted">${label}</span><span style="width:44px"></span></div>`;
}
function vIntro() {
  const tiles = TILES.map((t) => t ? `<div><img src="a_${t}.png" alt=""></div>` : '<div class="me">你？</div>').join('');
  return `<div class="col" style="gap:14px">
    <div style="background:var(--accent);border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;color:#fff">
      ${FROM ? `<span style="font-size:15px;font-weight:700;padding:0 4px">你的朋友是「${TYPES[FROM][0]}」！換你測測看 👇</span>` : SHARED ? '<span style="font-size:15px;font-weight:700;padding:0 4px">分享成功，謝謝你！也可以再測一次 👇</span>' : '<span style="font-size:14px;font-weight:700;letter-spacing:.12em;padding:0 4px">16種吃貨動物</span>'}
      <h1 style="font-size:28px;line-height:1.3;font-weight:900;padding:0 4px">如果你是動物，<br>會是哪一種吃貨？</h1>
      <div class="tiles" aria-hidden="true">${tiles}</div>
    </div>
    <p style="margin:0;font-size:17px;line-height:1.6;color:#2F3A34;text-align:center">8個生活小情境，只問你平常怎麼過。<br>結果可能跟你想的不一樣！</p>
    <div style="display:flex;justify-content:center;gap:8px"><span class="chip">約2分鐘</span><span class="chip">8題單選</span><span class="chip">營養師團隊設計</span></div>
    <button type="button" class="btn" data-act="start" style="height:56px;font-size:19px">開始測驗，揭曉我的類型</button>
  </div>`;
}
function vQuiz() {
  const q = QUIZ[S.qi];
  const opts = q[1].map((o, i) => `<button type="button" class="opt ${S.picks[S.qi] === i ? 'on' : ''}" data-act="pick" data-v="${i}">${esc(o[1])}</button>`).join('');
  return `<div class="col" style="gap:20px">
    ${nav('quizBack', `第 ${S.qi + 1} 題／共 ${NQ} 題`)}
    <div class="bar"><i style="width:${Math.round((S.qi + 1) / NQ * 100)}%"></i></div>
    <h2 style="font-size:26px;line-height:1.45;font-weight:700">${esc(q[0])}</h2>
    ${q[2] ? `<p style="margin:0;font-size:16px;line-height:1.6;color:var(--sub);background:#fff;border-radius:12px;padding:12px 14px">${esc(q[2])}</p>` : ''}
    <div class="col" style="gap:12px">${opts}</div>
  </div>`;
}
function href(kind, c) {
  if (kind === 'book') return CONFIG.BOOK_URL;
  if (kind === 'line') return CONFIG.LINE_URL;
  const u = CONFIG.SHOP_BY_TYPE[c] || CONFIG.SHOP_URL;
  return u === '#' ? u : u + (u.includes('?') ? '&' : '?') + 'utm_source=quiz&utm_medium=' + encodeURIComponent(SRC) + '&utm_campaign=' + c;
}
function vReport() {
  const r = result(), d = DETAIL[r.c];
  const tips = d[1].map((t, i) => `<div style="display:flex;gap:10px;align-items:flex-start"><span style="flex-shrink:0;width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px">${i + 1}</span><span style="font-size:16px;line-height:1.65;color:#2F3A34">${t}</span></div>`).join('');
  return `<div class="col" style="gap:16px">
    <span style="font-size:17px;color:var(--sub);text-align:center">如果你是動物，你會是</span>
    <img class="sharecard" src="card_${r.c}.jpg" alt="我的吃貨動物是${r.T[0]}：${r.T[1]}">
    <div class="card col" style="gap:10px;padding:16px">
      <span style="font-size:17px;font-weight:700;text-align:center">你是${r.T[0]}！朋友會是哪一種？</span>
      <div class="share">
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl(r.c, 'fb'))}" data-share="fb" style="background:#1877F2">Facebook</a>
        <button type="button" data-share="line" style="background:#06C755">LINE</button>
        <button type="button" data-share="more" style="background:var(--accent)">更多分享</button>
      </div>
      <span id="shareMsg" style="font-size:13px;color:var(--sub);text-align:center">也可以長按圖卡儲存，貼到IG限動</span>
    </div>
    <p style="margin:0;font-size:16px;line-height:1.7;color:#3D4842;text-align:center">${r.T[2]}</p>
    <div class="card col" style="gap:8px;padding:16px;background:#FBEFD9;border-color:#FBEFD9">
      <span style="font-size:17px;font-weight:700;color:#7A4B0E">你的吃法，哪裡容易出事</span>
      <p style="margin:0;font-size:16px;line-height:1.7;color:#2F3A34">${d[0]}</p>
    </div>
    <div class="card col" style="gap:12px;padding:16px;background:var(--soft);border-color:var(--soft)">
      <span style="font-size:17px;font-weight:700;color:#1E5A3C">三個今天就能做的小改變</span>
      ${tips}
      <span style="font-size:13px;color:var(--sub)">營養師團隊建議，不用買任何東西</span>
    </div>
    <div class="card col" style="gap:6px;padding:14px 16px">
      <span style="font-size:16px;font-weight:700">想偷懶的話</span>
      <p style="margin:0;font-size:16px;line-height:1.7;color:#2F3A34">${d[3]} <a href="${href('shop', r.c)}" target="_blank" rel="noopener" data-click="shop" style="color:var(--accent);font-weight:700">看這個 →</a></p>
    </div>
    <p style="margin:0;font-size:13px;line-height:1.6;color:var(--sub)">本測驗用於了解個人飲食與生活習慣，不能取代醫師診斷。懷孕、哺乳、有慢性病或長期服藥者，調整飲食前請先諮詢營養師或醫師，也可以<a href="${CONFIG.BOOK_URL}" target="_blank" rel="noopener" data-click="book" style="color:var(--sub)">預約門診</a>。</p>
    <button type="button" data-act="restart" style="align-self:center;height:44px;padding:0 16px;border:0;background:transparent;color:var(--sub);font-size:15px;text-decoration:underline">重新測驗</button>
  </div>`;
}
function vDock() {
  if (S.step !== 'report') return '';
  return `<div class="dock"><a class="btn" href="${CONFIG.LINE_URL}" target="_blank" rel="noopener" data-click="line">加 LINE 問營養師</a></div>`;
}

const VIEWS = { intro: vIntro, quiz: vQuiz, report: vReport };
function render(scrollTop) {
  document.getElementById('main').innerHTML = VIEWS[S.step]();
  document.getElementById('dock').innerHTML = vDock();
  if (scrollTop) window.scrollTo(0, 0);
  if (S.step === 'report') sendResult(result());
}
function go(step) { S.step = step; render(true); }

document.addEventListener('click', (e) => {
  const sh = e.target.closest('[data-share]');
  if (sh) { if (sh.dataset.share === 'fb' && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) e.preventDefault(); doShare(sh.dataset.share); return; }
  const link = e.target.closest('[data-click]');
  if (link) { sendClick(link.dataset.click, result()); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'start': S.qi = 0; go('quiz'); break;
    case 'quizBack': if (S.qi > 0) { S.qi--; render(true); } else go('intro'); break;
    case 'pick': S.picks[S.qi] = +v; S.answers[S.qi] = QUIZ[S.qi][1][+v][0]; if (S.qi < NQ - 1) { S.qi++; render(true); } else go('report'); break;
    case 'restart': S = fresh(); go('intro'); break;
  }
});
/* ---------- LINE（LIFF）---------- */
async function initLiff() {
  if (!CONFIG.LIFF_ID || !window.liff) return;
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    IN_LINE = liff.isInClient();
    if (!liff.isLoggedIn()) { if (IN_LINE) liff.login(); return; }
    const p = await liff.getProfile();
    LINE_UID = p.userId || '';
  } catch (e) { /* 不在LINE或設定有誤時，測驗照常進行 */ }
}

render();
initLiff();
</script>
